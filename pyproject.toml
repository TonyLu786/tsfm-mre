[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tsfm-mre"
dynamic = ["version"]
description = "Reproducible, risk-aware evaluation of probabilistic forecasts for financial time series"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Juntong Lu" }]
requires-python = ">=3.11"
keywords = [
    "time series",
    "foundation models",
    "probabilistic forecasting",
    "forecast evaluation",
    "value at risk",
    "expected shortfall",
    "backtesting",
    "yield curve",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]
dev = ["pytest>=8", "ruff==0.13.0"]

[project.scripts]
tsfm-mre = "tsfm_mre.cli:main"

[project.urls]
Homepage = "https://github.com/TonyLu786/tsfm-mre"
Paper = "https://doi.org/10.1145/3785706.3785728"
Issues = "https://github.com/TonyLu786/tsfm-mre/issues"

[tool.hatch.version]
path = "src/tsfm_mre/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_mre"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "configs", "docs", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error:::tsfm_mre"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tsfm_mre"]
